<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Job Automator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 350px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    
    .logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    
    .title {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a2e;
    }
    
    .subtitle {
      font-size: 12px;
      color: #666;
    }
    
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    
    .status-ready {
      background: #d4edda;
      color: #155724;
    }
    
    .status-no-profile {
      background: #fff3cd;
      color: #856404;
    }
    
    .profile-card {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    
    .profile-name {
      font-weight: 600;
      color: #1a1a2e;
      font-size: 14px;
    }
    
    .profile-email {
      color: #666;
      font-size: 12px;
    }
    
    .profile-stats {
      display: flex;
      gap: 16px;
      margin-top: 12px;
    }
    
    .stat {
      text-align: center;
    }
    
    .stat-number {
      font-size: 18px;
      font-weight: 700;
      color: #667eea;
    }
    
    .stat-label {
      font-size: 10px;
      color: #999;
      text-transform: uppercase;
    }
    
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 10px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }
    
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    
    .detected-fields {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 16px;
    }
    
    .field-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 12px;
    }
    
    .field-name {
      color: #333;
      font-weight: 500;
    }
    
    .field-value {
      color: #667eea;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .log-container {
      background: #1a1a2e;
      border-radius: 8px;
      padding: 12px;
      max-height: 120px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 11px;
      margin-bottom: 16px;
    }
    
    .log-entry {
      color: #4ade80;
      margin-bottom: 4px;
    }
    
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 4px;
      transition: width 0.3s;
    }
    
    .hidden {
      display: none;
    }
    
    .footer {
      text-align: center;
      font-size: 10px;
      color: #999;
      margin-top: 16px;
    }
    
    .footer a {
      color: #667eea;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">✨</div>
      <div>
        <div class="title">AI Job Automator</div>
        <div class="subtitle">Auto-Apply Extension</div>
      </div>
    </div>
    
    <div id="status-container">
      <div id="status-badge" class="status-badge status-ready">
        <span>●</span> Ready to Auto-Fill
      </div>
    </div>
    
    <div id="profile-section" class="profile-card">
      <div class="profile-name" id="profile-name">Loading...</div>
      <div class="profile-email" id="profile-email">-</div>
      <div class="profile-stats">
        <div class="stat">
          <div class="stat-number" id="fields-count">0</div>
          <div class="stat-label">Fields Detected</div>
        </div>
        <div class="stat">
          <div class="stat-number" id="filled-count">0</div>
          <div class="stat-label">Fields Filled</div>
        </div>
      </div>
    </div>
    
    <div id="progress-section" class="hidden">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
      </div>
    </div>
    
    <div id="fields-section" class="detected-fields hidden">
      <!-- Fields will be added here -->
    </div>
    
    <div id="log-section" class="log-container hidden">
      <!-- Logs will be added here -->
    </div>
    
    <button id="scan-btn" class="btn btn-secondary">
      🔍 Scan Page for Forms
    </button>
    
    <button id="fill-btn" class="btn btn-primary hidden">
      ⚡ Auto-Fill All Fields
    </button>
    
    <button id="reset-btn" class="btn btn-secondary hidden">
      🔄 Reset
    </button>
    
    <div class="footer">
      <a href="http://localhost:5173/#/profile" target="_blank">Edit Profile</a> • 
      <a href="http://localhost:5173/#/pricing" target="_blank">Buy Credits</a>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
