<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Job Automator — Land Your Dream Job 3x Faster with AI</title>
    <meta name="description" content="AI-powered job search, ATS resume builder, cover letters, mock interviews and career coaching. Land your dream job 3x faster with AI Job Automator." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23533afd%22/><text x=%2250%22 y=%2272%22 font-size=%2260%22 text-anchor=%22middle%22>✨</text></svg>" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: 'var(--primary-color, #4f46e5)',
              secondary: 'var(--secondary-color, #10b981)',
              background: 'var(--background-color, #f8fafc)',
              'text-primary': 'var(--text-primary-color, #1f2937)',
              'text-secondary': 'var(--text-secondary-color, #6b7280)',
              /* Landing page tokens (Stripe-inspired, via getdesign.md) */
              canvas: 'var(--lp-canvas, #ffffff)',
              'canvas-soft': 'var(--lp-canvas-soft, #f6f9fc)',
              'canvas-cream': 'var(--lp-canvas-cream, #f5e9d4)',
              surface: 'var(--lp-canvas-soft, #f6f9fc)',
              surface2: 'var(--lp-canvas-cream, #f5e9d4)',
              surface3: 'var(--lp-hairline, #e3e8ee)',
              hairline: 'var(--lp-hairline, #e3e8ee)',
              'hairline-strong': 'var(--lp-hairline-input, #a8c3de)',
              ink: 'var(--lp-ink, #0d253d)',
              'ink-muted': 'var(--lp-ink-secondary, #273951)',
              'ink-subtle': 'var(--lp-ink-mute, #64748d)',
              'ink-tertiary': 'var(--lp-ink-mute, #64748d)',
              lavender: 'var(--lp-primary, #533afd)',
              'lavender-hover': 'var(--lp-primary-deep, #4434d4)',
              'lavender-focus': 'var(--lp-primary-press, #2e2b8c)',
              violet: 'var(--lp-primary, #533afd)',
              fuchsia: 'var(--lp-ruby, #ea2261)',
              cyan: 'var(--lp-primary-soft, #665efd)',
              amber: 'var(--lp-lemon, #9b6829)',
              pink: 'var(--lp-magenta, #f96bee)',
              success: 'var(--lp-success, #217a53)',
              'brand-dark': 'var(--lp-brand-dark, #1c1e54)',
            },
            animation: {
              'spin-slow': 'spin 3s linear infinite',
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              lift: 'lift 0.3s ease-out forwards',
            },
            keyframes: {
                lift: {
                    '0%': { transform: 'translateY(0)', boxShadow: 'var(--tw-shadow)' },
                    '100%': { transform: 'translateY(-4px)', boxShadow: 'var(--tw-shadow-lg)' },
                }
            },
            backgroundImage: {
              'gradient-primary': 'linear-gradient(to right, var(--primary-color), #6366f1)',
              'gradient-secondary': 'linear-gradient(to right, var(--secondary-color), #34d399)',
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://rsms.me/inter/inter.css');
      
      :root {
        --primary-color: #4f46e5;
        --secondary-color: #10b981;
        --background-color: #f8fafc;
        --text-primary-color: #1f2937;
        --text-secondary-color: #6b7280;
      }
      body {
        background-color: var(--background-color);
        color: var(--text-primary-color);
        font-family: 'Inter', sans-serif;
      }
    </style>
